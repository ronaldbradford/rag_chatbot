services:
  db:
    # VillageSQL 8.4 (MySQL fork) with vsql_vector 0.0.1.
    # First start of an empty datadir runs SET PERSIST vsql_allow_preview_extensions = ON
    # and INSTALL EXTENSION vsql_vector. Also published as tag vector-local.
    image: ghcr.io/ronaldbradford/villagesql-server:nightly.2026-09-14-vector
    container_name: marginalia-db
    environment:
      MYSQL_ROOT_PASSWORD: rag
      MYSQL_DATABASE: rag
      MYSQL_USER: rag
      MYSQL_PASSWORD: rag
    ports:
      - "3306:3306"
    volumes:
      - villagesql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prag"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  villagesql_data:
